.ch0{display:flex;align-items:baseline;justify-content:space-between;gap:2px 6px;flex-wrap:wrap;margin-bottom:2px}
.ch0 small{opacity:.7;font-size:11px}
.bar2{position:relative;height:16px;margin:4px 0;border-radius:8px;background:rgba(127,127,127,.28);overflow:hidden}
.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.bar2 s.hgh{position:absolute;top:0;bottom:0;border-radius:8px;background:#fff;pointer-events:none;animation:hgf .5s linear forwards}
@keyframes hgf{from{width:var(--w)}to{width:0}}
.bar2 b{position:relative;display:block;text-align:center;font-size:11px;line-height:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75);font-variant-numeric:tabular-nums;white-space:nowrap}
.xb i{background:linear-gradient(90deg,#a855f7,#d946ef)}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:1px 6px;margin-top:3px;font-variant-numeric:tabular-nums}
.sg2 span{white-space:nowrap}
.skr{display:flex;flex-wrap:wrap;gap:2px 5px;margin-top:3px;font-size:12px}
.hp{z-index:11}
.hbx{width:min(420px,94vw);max-height:88vh;padding:0}
.hc{padding:14px 14px 4px}
.hc h3{margin:0 0 4px}
.hm{display:grid;gap:10px;margin:12px 0 10px}
.hm button{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;font-size:16px;background:var(--card);color:var(--fg);border:2px solid var(--bd);box-shadow:0 3px 0 var(--bd)}
.hm button span{font-size:26px}
.hm button small{display:block;font-weight:400;opacity:.7;font-size:12px;margin-top:2px}
.hf{position:sticky;bottom:0;padding:10px 14px 14px;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hf button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd);box-shadow:0 2px 0 var(--bd)}
.ig{display:grid;grid-template-columns:34px 1fr;gap:7px 8px;font-size:13px;line-height:1.5;align-items:start}
.ig b{font-size:18px;text-align:center;line-height:1.3;font-weight:400}
.hs{font-size:12px;opacity:.7;margin:14px 0 8px;font-weight:700}
.cc{border-top:1px solid var(--bd);padding:10px 0}
.cc:first-of-type{border-top:0}
.cs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:13px;margin:6px 0 4px}
.tok.shk{box-shadow:0 0 0 2px #facc15,0 0 8px #facc15}.tok.gh{opacity:.55}.tok.gd{width:18px;height:18px;font-size:10px}.tok.gd.c0{border-color:var(--p0)}.tok.gd.c1{border-color:var(--p1)}.tok.cl{opacity:.5;border-style:dashed}.tok.cl.c0{border-color:var(--p0)}.tok.cl.c1{border-color:var(--p1)}
#confirmBox{position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}#confirmBox.show{display:flex}#confirmBox .cbx{width:min(340px,100%);background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 12px 36px rgba(0,0,0,.45);text-align:center}#confirmBox h3{margin:0 0 10px;font-size:19px}#confirmBox p{margin:0 0 18px;line-height:1.6;font-size:14px}#confirmBox .cbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}#confirmBox .cbtn button:last-child{background:var(--card);color:var(--fg);border:1px solid var(--bd);box-shadow:0 2px 0 var(--bd)}

/* 英雄名片縮小版：選角與角色介紹列表共用緊湊尺寸 */
.pick button.pickhero{padding:8px 10px 9px;border-radius:12px;min-height:0;line-height:1.32;font-size:12px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.pick button.pickhero b{font-size:16px;margin-bottom:4px}
.pickhero .pickstats{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 4px;font-size:11px;line-height:1.25}
.pick button.pickhero .pickhint{margin-top:4px;font-size:9px}
.charlist .pick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button.cc{padding:7px 9px;margin:0;border-radius:11px;line-height:1.35;font-size:12px;box-shadow:0 2px 0 var(--bd)}
button.cc b{font-size:15px!important}
button.cc .cs{font-size:11px;gap:1px 5px;margin:4px 0 2px}
button.cc small{font-size:10px}

#roomBadge{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:6;padding:7px 12px;border-radius:18px;background:linear-gradient(180deg,var(--ac2),var(--ac));color:#fff;border:1px solid rgba(255,255,255,.65);box-shadow:0 3px 9px rgba(0,0,0,.28);font-size:13px;font-weight:800;letter-spacing:1px;pointer-events:none}
.net-join-btn,.net-back-btn{display:block;width:100%;box-sizing:border-box;margin-top:10px;background:linear-gradient(180deg,var(--ac2),var(--ac));color:#fff;border:0;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.28);text-align:center;font-weight:700;padding:12px 4px}
</style></head><body><div id="confirmBox" onclick="if(event.target===this)closeConfirm()"><div class="cbx"><h3 id="confirmTitle">確認操作</h3><p id="confirmMsg"></p><div class="cbtn"><button onclick="confirmAction()">確認</button><button onclick="closeConfirm()">取消</button></div></div></div><button id="snd" onclick="SET=!SET;renderSet()"><span class="gi">⚙️</span></button><div id="setp"></div><div id="app"></div>

function attachEnemySwipe(){

let HGS={};
function hgGet(p,i){let h=HGS[i];if(!h||h.g!==GID||h.p!==p)h=HGS[i]={g:GID,p:p,hp:p.hp,q:[],nt:0};return h}
// 同一目標連續受傷：每段白色殘影至少間隔 0.3 秒才開始，前一段到時直接被取代
function hgPush(h,a,b){const now=Date.now(),t=Math.max(now,h.nt);h.nt=t+300;h.q=h.q.filter(x=>x.t+500>now);h.q.push({a:a,b:b,t:t})}
function hpHit(q,d){const i=P.indexOf(q);if(i<0)return;const h=hgGet(q,i),pc=v=>Math.max(0,Math.min(100,v/q.mhp*100)),prev=h.hp>q.hp?h.hp:q.hp+d;hgPush(h,pc(q.hp),pc(prev));h.hp=q.hp}
function hpGhost(p,i){const now=Date.now(),h=hgGet(p,i),pc=v=>Math.max(0,Math.min(100,v/p.mhp*100));
 if(p.hp<h.hp)hgPush(h,pc(p.hp),pc(h.hp));else if(p.hp>h.hp){h.q=[];h.nt=0}
 h.hp=p.hp;let g=null;for(const x of h.q)if(x.t<=now&&now-x.t<500)g=x;
 return g&&g.b>g.a?`<s class="hgh" style="left:calc(${g.a}% - 12px);--w:calc(${g.b-g.a}% + 12px);width:var(--w);animation-delay:-${now-g.t}ms"></s>`:''}

 const row=(t,nm,d,m)=>`<div class="sr" style="display:block"><b>${t} ${nm}</b>${m?`<small style="opacity:.7">　${m}</small>`:''}<br><small>${d||'技能說明暫缺'}</small></div>`;
 const selected=HELP.startsWith('c:')?Number(HELP.split(':')[1]):-1;
 const cards=CH.map((c,i)=>{const ag=(c.n=='弓手'?1:0)+(c.ag||0);
 const detail=`<div class="cc"><div style="font-size:18px"><b>${c.e} ${c.n}</b></div>
 <div class="cs"><span>❤️ 血量　${c.hp}</span><span>⚡ 體力　${c.st}</span><span>⚔️ 攻擊　${c.atk}</span><span>🛡️ 防禦　0</span><span>🎯 距離　${rgTxtC(c)}</span><span>💨 敏捷　${ag}</span></div>
 ${row('✨',c.sk,SKD[c.sk],CT(c,0)+'，'+(c.cd?'冷卻 '+c.cd+' 回合':'無冷卻'))}
 ${row('🌟',c.ex,SKD[c.ex],'額外技能 Lv.5 解鎖，'+(c.pas1?'被動，無消耗、無冷卻':CT(c,1)+'，'+((c.cd2==null?3:c.cd2)?'冷卻 '+(c.cd2==null?3:c.cd2)+' 回合':'無冷卻')))}
 ${c.ex2?row('🌟',c.ex2,SKD[c.ex2],'第二額外技能 Lv.10 解鎖，'+(c.pas2?'被動，無消耗、無冷卻':CT(c,2)+'，'+(c.cd3?'冷卻 '+c.cd3+' 回合':'無冷卻'))):row('🌟','（尚未設計）','此技能欄位暫時空著','第二額外技能 Lv.10')}
 ${c.ex3?row('🌟',c.ex3,SKD[c.ex3],'第三額外技能 Lv.15 解鎖，'+(c.pas3?'被動，無消耗、無冷卻':CT(c,3)+'，'+(c.cd4?'冷卻 '+c.cd4+' 回合':'無冷卻'))):''}
 ${c.pa?row('🔰',c.pa,PAD[c.pa],'被動技能・'+passiveCdText(c.pa)):''}</div>`;
 return {name:c.e+' '+c.n,detail,card:`<button class="pickhero" style="width:100%;text-align:left;cursor:pointer" onclick="window.openHeroHelp(${i})"><b>${c.e} ${c.n}</b><div class="pickstats"><span>❤️ ${c.hp}</span><span>⚡ ${c.st}</span><span>⚔️ ${c.atk}</span><span>🎯 距離 ${rgTxtC(c)}</span></div><small class="pickhint">點擊查看完整角色介紹與技能 →</small></button>`};
 });
 if(selected>=0&&selected<cards.length)return cards[selected].detail;
 return '<p style="margin:0 0 10px;color:var(--muted)">選擇一位英雄，查看個別屬性、被動與技能介紹。</p><div class="charlist"><div class="pick">'+cards.map(x=>x.card).join('')+'</div></div>';
}

function shopPage(){const items=[['🧪','體力藥水','購買後獲得 1 瓶；使用時立即恢復 5 點體力。'],['💊','生命藥水','購買後獲得 1 瓶；使用時立即恢復 50 點血量。回血會先補英雄本體，本體滿血後溢出的治療依序恢復聖靈、衛兵與分身。'],['🌀','敏捷藥水','購買後獲得 1 瓶；使用後立即使敏捷 +1，效果持續 3 回合（包含使用當回合）。'],['💚','恢復藥水','購買後獲得 1 瓶；使用後立即發動，接下來 3 回合每回合恢復 25 點血量。'],['⚡','活力藥水','購買後獲得 1 瓶；使用後立即發動，接下來 3 回合每回合恢復 2.5 點體力。'],['🔰','勇者之劍（被動技能）','購買後永久生效；討伐四隻魔物時，攻擊力 +10。戰士也能購買，並可與角色本身的勇者被動效果疊加。'],['🗝️','勇者之鑰（被動技能）','購買後永久生效；未購買時，普通攻擊與技能仍可命中四隻魔物、照常消耗資源及觸發命中效果，但傷害固定為 0；購買後才會造成正常傷害。魔物不再跳出討伐視窗，改以一般攻擊／技能逐次命中。'],['🏅','勇者之勛（被動技能）','購買後永久生效；成功討伐魔物時，額外獲得 1000 經驗值及 1000 金幣，可與戰士的勇者被動獎勵疊加。']];return '<p style="margin:0 0 10px;font-size:13px;line-height:1.7">順時針經過或抵達自己的起點時會自動進入商店。以下每項商品的基本價格均為 <b>1000 金幣</b>；當所有英雄都達到 Lv.15 時，商店所有商品價格會變成 <b>2000 金幣</b>。購買與使用道具都不算一次行動。</p>'+items.map(x=>`<div class="ig"><b>${x[0]}</b><span><strong>${x[1]}</strong><br>${x[2]}<br><small>價格：1000 金幣（全英雄滿級時 2000 金幣）</small></span></div>`).join('')+'<p style="margin:10px 0 0;font-size:13px;line-height:1.7">商店會顯示目前持有金幣、各商品已購買數量或購買狀態。金幣不足時仍可查看商店；不購買任何商品也能直接離開商店，離開後該回合結束。</p>'}

function logHTML(){return `<div class="shop hp" onclick="if(event.target===this){LOGM=0;render()}"><div class="sbx hbx"><div class="hc"><h3>📜 回合播報（詳細）</h3>${LOGALL.map(l=>`<div class="lgl">${l}</div>`).join('')}</div><div class="hf" style="grid-template-columns:1fr"><button onclick="LOGM=0;render()">關閉</button></div></div></div>`}
function helpHTML(){
 const ft=bk=>bk?`<div class="hf"><button class="g" onclick="HELP=${String(HELP).startsWith('c:')?"'c'":"'m'"};render()">← ${String(HELP).startsWith('c:')?'返回角色列表':'返回說明'}</button><button onclick="window.closeHelpPage()">關閉</button></div>`:`<div class="hf" style="grid-template-columns:1fr"><button onclick="window.closeHelpPage()">關閉</button></div>`;
 let t,b,bk=1;
 if(HELP=='c'||String(HELP).startsWith('c:')){t='👤 角色介紹';b=chPage()}
 else if(HELP=='i'){t='🧭 圖示介紹';b=iconPage()}
 else if(HELP=='r'){t='📖 規則介紹';b=rulePage()}
 else if(HELP=='s'){t='🏪 商店商品介紹';b=shopPage()}
 else{bk=0;t='❓ 說明';b=`<div class="hm"><button onclick="window.openHelpPage('c')"><span>👤</span><div>角色<small>各角色的屬性、技能與被動</small></div></button><button onclick="window.openHelpPage('i')"><span>🧭</span><div>圖示<small>地圖與狀態圖示的意思</small></div></button><button onclick="window.openHelpPage('r')"><span>📖</span><div>規則<small>完整遊戲規則</small></div></button><button onclick="window.openHelpPage('s')"><span>🏪</span><div>商店<small>介紹商店販售的商品、效果與價格</small></div></button></div>`}
 return `<div class="shop hp" onclick="if(event.target===this){HELP=0;render()}"><div class="sbx hbx"><div class="hc"><h3>${t}</h3>${b}</div>${ft(bk)}</div></div>`}
document.addEventListener('scroll',e=>{const c=e.target;if(!c||!c.classList||!c.classList.contains('cin'))return;const card=c.parentNode,b=card.querySelector('.sbar');if(!b||c.scrollHeight<=c.clientHeight+1)return;const h=c.clientHeight,r=h/c.scrollHeight;b.style.height=Math.max(16,h*r)+'px';b.style.top=(c.offsetTop+c.scrollTop*r)+'px';card.classList.add('scr');clearTimeout(card._st);card._st=setTimeout(()=>card.classList.remove('scr'),100)},true);
